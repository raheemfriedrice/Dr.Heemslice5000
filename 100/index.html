<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110b">
<title>The 100 — Legacy Contract</title>
<meta name="description" content="100 pages. A page a day. Your words, #RAW — no autocorrect, no edits, nobody but you. Saved on this device. Built by Rice + Claude.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hundred.css">
</head>
<body>
<header class="bar">
  <button class="bar__btn" id="toToc" aria-label="All pages">☰</button>
  <div class="bar__mid">
    <button class="nav" id="prev" aria-label="Previous page">‹</button>
    <div class="bar__page" id="pageLabel">Page 1 / 100</div>
    <button class="nav" id="next" aria-label="Next page">›</button>
  </div>
  <button class="bar__btn" id="menuBtn" aria-label="Menu">⋯</button>
</header>

<div class="prog"><div class="prog__fill" id="prog"></div></div>

<main class="page" id="pageView">
  <input class="title" id="title" placeholder="Page title (optional)" autocomplete="off" spellcheck="false">
  <textarea class="body" id="body" placeholder="Write it #RAW. No autocorrect, no edits, no one but you. A page a day. &amp; is a word. Typos are allowed. Nothing here is sent anywhere." spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
  <div class="meta" id="meta"></div>
</main>

<!-- TOC -->
<div class="sheet" id="toc" hidden>
  <div class="sheet__head">
    <h2>The 100</h2>
    <button class="x" id="tocX" aria-label="Close">✕</button>
  </div>
  <p class="sheet__sub" id="tocSub"></p>
  <div class="grid" id="grid"></div>
</div>

<!-- Menu -->
<div class="sheet" id="menu" hidden>
  <div class="sheet__head"><h2>Menu</h2><button class="x" id="menuX" aria-label="Close">✕</button></div>
  <div class="menu-list">
    <button class="mrow" id="exp">⬇︎ Export my book (.json backup)</button>
    <button class="mrow" id="expTxt">⬇︎ Export as readable .txt</button>
    <label class="mrow" style="cursor:pointer">⬆︎ Import a backup<input type="file" id="imp" accept=".json" hidden></label>
    <div class="mrow mrow--static" id="savedInfo"></div>
    <div class="mrow mrow--note">Everything is saved on <b>this device only</b>, as you type. Nothing is sent anywhere. Export often — a cleared browser forgets. Your words are never autocorrected.</div>
    <a class="mrow" href="../index.html">← Dr. Heemslice 5000</a>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="hundred.js"></script>
</body>
</html>
